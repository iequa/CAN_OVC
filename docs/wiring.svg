<text x="720" y="950" class="tiny">PCM5102A: только 3.3V, MCLK=GND. Output ~2 Vrms; AUX usually 0.5-1 Vrms.</text>
<text x="55" y="1045" class="small">• ПИТАНИЕ: 12V ACC -&gt; F1 1A -&gt; TVS -&gt; reverse protection -&gt; Mini360 5.0V.</text>
<text x="55" y="1069" class="small">• Mini360 output проверить мультиметром ДО подключения ESP32.</text>
<text x="55" y="1093" class="small">• MCP1700 3.3V — только PCM5102A; ESP32 питать от 5V.</text>
<text x="55" y="1117" class="small">• Общая земля обязательна. Аудиоземлю вести отдельно от силовой.</text>
<text x="55" y="1141" class="small">• CAN CAR: SN65HVD230, 120R выпаять. RS -&gt; GND.</text>
<text x="55" y="1165" class="small">• CAN CID: MCP2515/TJA, 120R onboard + 120R дисплея = ~60R.</text>
<text x="55" y="1189" class="small">• Level shifter TXS0108E обязателен: MCP2515 работает от 5V.</text>
<text x="55" y="1213" class="small">• Реле K1: обесточено = CID напрямую к авто; включено = через gateway.</text>
<text x="55" y="1237" class="small">• При сне/сбросе GPIO32=0 -&gt; реле обесточено -&gt; bypass.</text>
<text x="960" y="1045" class="small">• ПЕРВЫЙ ЗАПУСК В АВТО: только listen-only, без 0x691/0x6C1.</text>
<text x="960" y="1069" class="small">• Снять лог 0x6C1, 0x691, 0x501, 0x201, 0x206, 0x506.</text>
<text x="960" y="1093" class="small">• Не подключать обе пары MS-CAN одновременно.</text>
<text x="960" y="1117" class="small">• Проверить наличие AUX на CD70/DVD90. Если AUX нет — нужно отдельное решение.</text>
<text x="960" y="1141" class="small">• PCM5102A: MCLK -&gt; GND; FMT/DEMP/XSMT уже заданы платой.</text>
<text x="960" y="1165" class="small">• Аудио: 10uF + 10k/10k на канал; при клиппинге увеличить R1.</text>
<text x="960" y="1189" class="small">• ESP32: USB и 5V одновременно не подавать (если нет диода на плате).</text>
<text x="960" y="1213" class="small">• Корпус: антенна ESP32 не должна быть за металлом.</text>
<text x="55" y="1290" class="tiny">Файл: docs/wiring.svg · Подробные таблицы: docs/WIRING.md</text>
</svg>